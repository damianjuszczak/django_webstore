{% load static %}
<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'main/css/notifications.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <title>{% block title %}Out Of Stock{% endblock %}</title>
</head>
<body>

    {% include 'main/layout/navbar.html' %}
    
    <main class="py-4">
        <div class="container main-content-wrapper p-3 p-md-5">
            {% block breadcrumbs %}
            {% endblock %}
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <div class="notifications-container">
        {% if messages %}
            {% for message in messages %}
                <div class="notification-item notification-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <script src="{% static 'main/js/notifications.js' %}"></script>
    <script src="{% static 'main/js/auth.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
