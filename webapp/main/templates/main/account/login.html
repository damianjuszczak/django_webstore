{% extends 'main/layout/layout.html' %}
{% load static %}
{% block title%}Log in{% endblock %}
 
{% block content%}
 <div class="d-flex align-items-center justify-content-center px-4" style="height: 80vh">
     <div style="max-width: 500px" class="w-100">
         <h1>Log in</h1>
         <form id="login-form" method="POST" action="{% url 'login_user' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block w-100">Log in</button>
        </form>
     </div>
 </div>
 
 {% endblock %}
